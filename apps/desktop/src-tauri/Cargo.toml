[package]
name = "clawgear-desktop"
version = "0.1.0"
description = "ClawGear Desktop App"
authors = ["ClawGear"]
edition = "2021"

[lib]
name = "clawgear_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
