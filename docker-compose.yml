services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: clawgear-postgres
    environment:
      POSTGRES_USER: clawgear
      POSTGRES_PASSWORD: clawgear
      POSTGRES_DB: clawgear
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawgear"]
      interval: 5s
      timeout: 5s
      retries: 5
    shm_size: 256mb
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100

volumes:
  pgdata:
