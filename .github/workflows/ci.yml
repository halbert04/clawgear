name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: npx @biomejs/biome check .

      - name: Typecheck
        run: pnpm -r run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: clawgear
          POSTGRES_PASSWORD: clawgear
          POSTGRES_DB: clawgear
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clawgear"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: DATABASE_URL="postgresql://clawgear:clawgear@localhost:5432/clawgear" pnpm db:migrate

      - name: Run tests
        run: pnpm -r run test
        env:
          DATABASE_URL: postgresql://clawgear:clawgear@localhost:5432/clawgear
